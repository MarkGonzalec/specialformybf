<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Важный вопросик...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6; /* Нежно-розовый фон */
            font-family: 'Comic Sans MS', cursive, sans-serif; /* Мемный шрифт */
            overflow: hidden; /* Чтобы не появлялись скроллы, когда кнопка убегает за края */
            text-align: center;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #ff4d4d;
            margin-bottom: 20px;
        }

        img {
            width: 220px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .buttons {
            position: relative;
            height: 60px;
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #btnYes {
            background-color: #4CAF50;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #btnYes:hover {
            transform: scale(1.1);
        }

        #btnNo {
            background-color: #ff4d4d;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            /* Абсолютное позиционирование, чтобы скрипт мог ее двигать */
            position: absolute; 
            left: 55%; /* Изначальная позиция рядом с кнопкой Да */
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <!-- Стартовая милая гифка -->
  
    <h1 id="question">Ты будешь моим парнем?) 👉👈</h1>
    
    <div class="buttons">
        <button id="btnYes">Да!</button>
        <button id="btnNo">Нет</button>
    </div>
</div>

<script>
    const btnNo = document.getElementById('btnNo');
    const btnYes = document.getElementById('btnYes');
    const question = document.getElementById('question');
    const gif = document.getElementById('gif');

    // Функция, которая заставляет кнопку убегать
    function moveButton() {
        // Убираем кнопку из обычного потока документа, чтобы она летала по всему экрану
        btnNo.style.position = 'fixed';
        
        // Вычисляем случайные координаты внутри видимого окна
        const maxX = window.innerWidth - btnNo.offsetWidth;
        const maxY = window.innerHeight - btnNo.offsetHeight;
        
        const randomX = Math.random() * maxX;
        const randomY = Math.random() * maxY;

        // Применяем новые координаты
        btnNo.style.left = `${randomX}px`;
        btnNo.style.top = `${randomY}px`;
    }

    // Триггер для компьютеров (наведение мыши)
    btnNo.addEventListener('mouseover', moveButton);
    
    // Триггер для смартфонов (касание экрана)
    btnNo.addEventListener('touchstart', (e) => {
        e.preventDefault(); // Запрещаем браузеру регистрировать нажатие
        moveButton();
    }, { passive: false });
    
    // На всякий случай добавляем убегание и по клику
    btnNo.addEventListener('click', moveButton);

    // Счастливый конец, если нажали "Да"
    btnYes.addEventListener('click', () => {
        question.innerText = "Ура! Я так и знал! 🥰❤️";
        // Меняем гифку на другую
        gif.src = "https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif"; 
        
        // Прячем обе кнопки
        btnNo.style.display = 'none';
        btnYes.style.display = 'none';
    });
</script>

</body>
</html>
